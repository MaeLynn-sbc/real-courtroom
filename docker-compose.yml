services:
  postgres:
    image: postgres:16-alpine
    container_name: tcpms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: courtroom
      POSTGRES_PASSWORD: courtroom_dev_password
      POSTGRES_DB: tcpms_dev
    ports:
      - "5432:5432"
    volumes:
      - tcpms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtroom -d tcpms_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: tcpms-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tcpms-postgres-data:
